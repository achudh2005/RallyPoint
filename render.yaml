services:
  - type: web
    name: rallypoint-api
    env: node
    plan: starter
    buildCommand: npm install && cd apps/api && npx prisma generate && npm run build --workspace=@rallypoint/engine && npm run build --workspace=@rallypoint/api
    startCommand: node apps/api/dist/server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: rallypoint-postgres
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: REFRESH_TOKEN_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: https://rallypoint.vercel.app

  - type: web
    name: rallypoint-web
    env: static
    buildCommand: npm install && npm run build --workspace=@rallypoint/engine && npm run build --workspace=@rallypoint/web
    staticPublishPath: ./apps/web/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: rallypoint-postgres
    plan: starter
    databaseName: rallypoint_db
    user: rallypoint
