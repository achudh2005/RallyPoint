services:
  postgres:
    image: postgres:16-alpine
    container_name: rallypoint-postgres
    restart: always
    environment:
      POSTGRES_USER: rallypoint
      POSTGRES_PASSWORD: rallypoint_secret
      POSTGRES_DB: rallypoint_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rallypoint -d rallypoint_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: rallypoint-pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@rallypoint.local
      PGADMIN_DEFAULT_PASSWORD: admin_secret
    ports:
      - "5050:80"
    depends_on:
      - postgres

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: rallypoint-api
    restart: always
    environment:
      PORT: 4000
      DATABASE_URL: postgres://rallypoint:rallypoint_secret@postgres:5432/rallypoint_db
      JWT_SECRET: production_rallypoint_secret_jwt_key_at_least_32_characters_long
      REFRESH_TOKEN_SECRET: production_rallypoint_refresh_secret_key_at_least_32_characters_long
      CORS_ORIGIN: http://localhost:3000
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: rallypoint-web
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - api

volumes:
  postgres_data:
