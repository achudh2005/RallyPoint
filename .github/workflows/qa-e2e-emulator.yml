name: RallyPoint E2E & Android Emulator QA

on:
  push:
    branches: [main]
    tags: ['qa-phase-*', 'v*']
  pull_request:
    branches: [main]

jobs:
  playwright-e2e:
    name: Playwright E2E, Visual & Accessibility Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Clients & Build Shared Packages
        run: |
          npm run --workspace=@rallypoint/db prisma:generate
          cd apps/api && npx prisma generate && cd ../..
          npm run --workspace=@rallypoint/engine build --if-present
          npm run --workspace=@rallypoint/scoring-rules build --if-present
          npm run --workspace=@rallypoint/ranking build --if-present
          npm run --workspace=@rallypoint/ui build --if-present

      - name: Install Playwright Chromium
        working-directory: apps/web
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E Suite
        working-directory: apps/web
        run: npm run test:e2e

      - name: Upload Playwright Artifacts on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: apps/web/test-results/
          retention-days: 7

  android-emulator-smoke:
    name: Android API 35 Emulator Smoke & Upgrade Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies & Build Web + Sync Capacitor
        run: |
          npm ci
          npm run --workspace=@rallypoint/db prisma:generate
          npm run --workspace=@rallypoint/engine build --if-present
          npm run --workspace=@rallypoint/scoring-rules build --if-present
          npm run --workspace=@rallypoint/ranking build --if-present
          npm run --workspace=@rallypoint/ui build --if-present
          npm run build:web
          npm run cap:sync

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK Platform 35
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Current Debug APK
        working-directory: apps/web/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Download Previous Release (v1.2.0) Debug APK for Upgrade Test
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v1.2.0 --pattern "RallyPoint-debug.apk" --dir /tmp/old-apk || true

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Emulator Smoke, Rotation, Back, Kill/Relaunch, Airplane & Upgrade Tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: |
            set -e
            adb wait-for-device

            # 1. Upgrade test: install v1.2.0 first if downloaded, launch, then upgrade in-place
            if [ -f /tmp/old-apk/RallyPoint-debug.apk ]; then
              echo "Installing v1.2.0 debug APK..."
              adb install /tmp/old-apk/RallyPoint-debug.apk
              adb shell am start -n com.rallypoint.app.debug/com.rallypoint.app.MainActivity
              sleep 4
              echo "Upgrading in-place to new debug APK..."
              adb install -r apps/web/android/app/build/outputs/apk/debug/app-debug.apk
            else
              adb install -r apps/web/android/app/build/outputs/apk/debug/app-debug.apk
            fi

            # 2. Launch app & verify running PID
            adb shell am start -n com.rallypoint.app.debug/com.rallypoint.app.MainActivity
            sleep 5
            PID=$(adb shell pidof com.rallypoint.app.debug || true)
            echo "App PID after launch: $PID"
            test -n "$PID"

            # 3. Rotate device landscape -> portrait & verify still alive
            adb shell settings put system accelerometer_rotation 0
            adb shell settings put system user_rotation 1
            sleep 2
            adb shell settings put system user_rotation 0
            sleep 2
            PID_ROT=$(adb shell pidof com.rallypoint.app.debug || true)
            test -n "$PID_ROT"

            # 4. Send Back key event
            adb shell input keyevent 4
            sleep 1

            # 5. Force-stop (kill) & relaunch to verify crash-free restore
            adb shell am force-stop com.rallypoint.app.debug
            sleep 1
            adb shell am start -n com.rallypoint.app.debug/com.rallypoint.app.MainActivity
            sleep 4
            PID_RESTORE=$(adb shell pidof com.rallypoint.app.debug || true)
            test -n "$PID_RESTORE"

            # 6. Airplane mode / offline network toggle
            adb shell svc wifi disable || true
            adb shell svc data disable || true
            sleep 2
            adb shell svc wifi enable || true
            adb shell svc data enable || true

            # 7. Capture dumpsys gfxinfo frame stats
            adb shell dumpsys gfxinfo com.rallypoint.app.debug | head -n 40
            echo "Emulator smoke & upgrade checks PASSED."
